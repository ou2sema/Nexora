name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The document tests print real PDFs with the engine the API ships, and read the
      # printed text back with `pdftotext`, so the job needs both.
      - name: Install the document renderer and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          npx playwright-core install --with-deps chromium chromium-headless-shell

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        id: unit-tests
        run: |
          npm run build:packages
          start=$(date +%s)
          set +e
          npm test --workspace @mystock/api -- \
            --reporter=default \
            --reporter=json \
            --outputFile.json="$RUNNER_TEMP/api-test-results.json"
          status=$?
          set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit $status

      # Best effort: observability must never turn a green build red. The script
      # skips itself when the repository has no GRAFANA_URL/GRAFANA_TOKEN.
      - name: Record the test run in Grafana
        if: always()
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          bash infra/observability/scripts/ci-annotate.sh \
            "$RUNNER_TEMP/api-test-results.json" \
            "${{ steps.unit-tests.outputs.seconds }}" \
            "api ${GITHUB_SHA::7}" "api-tests"

      - name: Build
        run: npm run build

  database:
    name: Virgin-database migrations, seed, schema guard
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      # The drill boots the API and waits for /health/ready to answer 200, and since ADR-0019
      # readiness prints a document — an API with no Chromium answers 503 forever.
      - name: Install the document renderer
        run: npx playwright-core install --with-deps chromium chromium-headless-shell

      - name: Run the virgin-database drill
        env:
          DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
          DATABASE_SSL: 'false'
        run: npm run drill:virgin-database --workspace @mystock/api

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap and migrate PostgreSQL
        env:
          PGPASSWORD: pw
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'EOSQL'
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text not null unique,
            created_at timestamptz not null default now()
          );
          create role authenticated nologin;
          EOSQL
          for file in $(ls supabase/migrations/*.sql | sort); do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Write web test environment
        run: |
          cat > apps/web/.env.local <<'EOF'
          VITE_SUPABASE_URL=https://testsupabase.supabase.co
          VITE_SUPABASE_ANON_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          VITE_API_BASE_URL=http://localhost:4100/api/v1
          EOF

      - name: Build workspaces
        run: npm run build

      - name: Run E2E suite
        id: e2e-tests
        run: |
          start=$(date +%s)
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/e2e-results.json" npm run test:e2e
          status=$?
          set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Record the E2E run in Grafana
        if: always()
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          bash infra/observability/scripts/ci-annotate.sh \
            "$RUNNER_TEMP/e2e-results.json" \
            "${{ steps.e2e-tests.outputs.seconds }}" \
            "e2e desktop+mobile" "e2e-tests"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/allure-results
          retention-days: 7

  e2e-local:
    name: Playwright local stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build workspaces
        run: npm run build

      - name: Run local-stack E2E suite
        id: e2e-local-tests
        run: |
          start=$(date +%s)
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/e2e-local-results.json" \
            npm run test:e2e:local --workspace @mystock/web
          status=$?
          set -e
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Record the local-stack E2E run in Grafana
        if: always()
        continue-on-error: true
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          bash infra/observability/scripts/ci-annotate.sh \
            "$RUNNER_TEMP/e2e-local-results.json" \
            "${{ steps.e2e-local-tests.outputs.seconds }}" \
            "e2e local stack desktop+mobile" "e2e-tests"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-artifacts
          path: |
            apps/web/test-results
            apps/web/allure-results
          retention-days: 7
