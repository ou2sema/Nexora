name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Bootstrap and migrate PostgreSQL
        env:
          PGPASSWORD: pw
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'EOSQL'
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text not null unique,
            created_at timestamptz not null default now()
          );
          create role authenticated nologin;
          EOSQL
          for file in $(ls supabase/migrations/*.sql | sort); do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Write web test environment
        run: |
          cat > apps/web/.env.local <<'EOF'
          VITE_SUPABASE_URL=https://testsupabase.supabase.co
          VITE_SUPABASE_ANON_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          VITE_API_BASE_URL=http://localhost:4100/api/v1
          EOF

      - name: Build workspaces
        run: npm run build

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/allure-results
          retention-days: 7

  e2e-local:
    name: Playwright local stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build workspaces
        run: npm run build

      - name: Run local-stack E2E suite
        run: npm run test:e2e:local --workspace @mystock/web

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-artifacts
          path: |
            apps/web/test-results
            apps/web/allure-results
          retention-days: 7
