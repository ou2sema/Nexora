global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: nexora-observability

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Local API from `npm run dev --workspace @mystock/api`.
  - job_name: nexora-api-local
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4100']
        labels:
          service: nexora-api
          environment: local

  # The Render service. A free instance sleeps after 15 idle minutes and can
  # take 30-50 s to wake, so this job is slower and more patient than the local
  # one. The token file is created from secrets/metrics_token.example.
  - job_name: nexora-api-render
    metrics_path: /metrics
    scheme: https
    scrape_interval: 60s
    scrape_timeout: 45s
    static_configs:
      - targets: ['nexora-web-service.onrender.com']
        labels:
          service: nexora-api
          environment: production
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus-secrets/metrics_token
