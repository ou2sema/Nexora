name: nexora-observability

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: nexora-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      # Bound to loopback: reach the UI through an SSH tunnel, never expose it.
      - '127.0.0.1:9090:9090'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      # Outside /etc/prometheus: that mount is read-only, so Docker cannot
      # create a nested mountpoint under it.
      - ./secrets:/etc/prometheus-secrets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Lets the container scrape an API running on the Docker host (Linux).
      - 'host.docker.internal:host-gateway'
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: nexora-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Otherwise the "View in Alertmanager" links in Slack point at the
      # container hostname. Set this to the tunnel or public URL on a VPS.
      - --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # Holds the Slack incoming-webhook URL. Outside /etc/alertmanager for the
      # same read-only-mount reason as Prometheus below.
      - ./secrets:/etc/alertmanager-secrets:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:13.3.0
    container_name: nexora-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infra/observability/.env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
