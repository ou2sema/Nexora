# The default receiver has no integrations: alerts are visible in Prometheus
# and Alertmanager, but nothing is sent. Add an email, Slack or webhook
# integration below, then `docker compose restart alertmanager`.
route:
  receiver: default
  group_by: ['alertname', 'environment', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
